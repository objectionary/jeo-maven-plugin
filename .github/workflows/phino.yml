---
# yamllint disable rule:line-length
name: phino
'on':
  push:
    branches:
      - master
  pull_request:
    branches:
      - master
concurrency:
  group: phino-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    timeout-minutes: 15
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          distribution: 'zulu'
          java-version: 21
      - uses: actions/cache@v6
        with:
          path: ~/.m2/repository
          key: maven-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            maven-
      - uses: objectionary/phino@768aaec459b06c2e514af32accf218545ed20c2f  # master
        with:
          version: 0.0.156
      - run: mvn clean install -ntp -D"skipTests" -D"invoker.test=phi-unphi" --errors --batch-mode

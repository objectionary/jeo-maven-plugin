---
# yamllint disable rule:line-length
name: phino
'on':
  push:
    branches:
      - master
  pull_request:
    branches:
      - master
concurrency:
  group: phino-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read

jobs:
  test:
    timeout-minutes: 15
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6.2.0
        with:
          distribution: 'zulu'
          java-version: 21
      - uses: actions/cache@v6
        with:
          path: ~/.m2/repository
          key: maven-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            maven-
      - uses: objectionary/phino@a5e7eaf12d1372fe804fb78ac165bf83121c050f  # master
        with:
          version: 0.0.161
      - run: mvn clean install -ntp -D"skipTests" -D"invoker.test=phi-unphi" --errors --batch-mode

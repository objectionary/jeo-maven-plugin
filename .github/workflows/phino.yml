---
# yamllint disable rule:line-length
name: phino
'on':
  push:
    branches:
      - master
  pull_request:
    branches:
      - master
concurrency:
  group: phino-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    timeout-minutes: 15
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: 'zulu'
          java-version: 21
      - uses: actions/cache@v6
        with:
          path: ~/.m2/repository
          key: maven-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            maven-
      - uses: objectionary/phino@f8f28f00a9a09605a9404539ed66e4493c325d8c  # master
        with:
          version: 0.0.156
      - run: mvn clean install -ntp -D"skipTests" -D"invoker.test=phi-unphi" --errors --batch-mode

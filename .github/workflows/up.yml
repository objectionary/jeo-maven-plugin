---
# yamllint disable rule:line-length
name: up
'on':
  push:
    branches:
      - master
    tags:
      - '*'
concurrency:
  group: up-${{ github.ref }}
  cancel-in-progress: true
jobs:
  up:
    timeout-minutes: 15
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - run: |-
          git fetch --tags --force && \
          latest=$(git tag --sort=creatordate | tail -1) && \
          prev=$(awk '/<artifactId>jeo-maven-plugin<\/artifactId>/{getline; print}' README.md | grep -oE '<version>[^<]+' | sed 's/<version>//') && \
          sed -i "s/${prev}/${latest}/g" README.md
      - uses: peter-evans/create-pull-request@v8
        with:
          branch: version-up
          commit-message: 'chore: new version in README'
          delete-branch: true
          title: 'chore: New version in README'
          assignees: volodya-lombrozo
          base: master

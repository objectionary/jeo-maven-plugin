---
# yamllint disable rule:line-length
name: mvn-qulice
'on':
  push:
    branches:
      - master
    paths:
      - '**.java'
      - '**/pom.xml'
      - '.github/workflows/maven.qulice.yml'
  pull_request:
    branches:
      - master
    paths:
      - '**.java'
      - '**/pom.xml'
      - '.github/workflows/maven.qulice.yml'
permissions:
  contents: read

concurrency:
  group: maven.qulice-${{ github.ref }}
  cancel-in-progress: true
jobs:
  check:
    strategy:
      matrix:
        os: [ ubuntu-24.04 ]
        java: [ 23 ]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          distribution: 'zulu'
          java-version: ${{ matrix.java }}
      - uses: actions/cache@v6
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-jdk-${{ matrix.java }}-maven-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-jdk-${{ matrix.java }}-maven-
      - run: mvn clean test-compile qulice:check -P"qulice" --errors --batch-mode
